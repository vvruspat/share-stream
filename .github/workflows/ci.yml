name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platforms:
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/native-platforms.yml
    with:
      tests_only: ${{ github.event_name == 'pull_request' }}
  web:
    name: Web lint and tests
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python3 scripts/ci/release_info.py
      - run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Lint, format and typecheck
        run: npm run check
        working-directory: web
      - name: Build production web bundle (main only)
        if: github.ref == 'refs/heads/main'
        run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Browser tests
        run: npm run test:e2e
        working-directory: web
        env:
          TEST_WEB_DEV: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      - name: Build backend image (main only)
        if: github.ref == 'refs/heads/main'
        run: bash scripts/ci/build-backend.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: backend-ci
          path: dist/backend/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && github.ref == 'refs/heads/main'
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
  native:
    name: ${{ github.event_name == 'pull_request' && 'macOS native tests' || 'macOS universal AU + VST3 + receiver' }}
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: command -v ninja || brew install ninja
      - name: Native tests (PR)
        if: github.event_name == 'pull_request'
        run: bash scripts/ci/test-native.sh
      - name: Build universal products and validate Setup (main only)
        if: github.ref == 'refs/heads/main'
        run: bash scripts/ci/build-native.sh
