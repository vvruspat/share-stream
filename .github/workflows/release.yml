name: Release
run-name: Release ${{ inputs.recovery_tag || github.ref_name }}
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      backend_only:
        description: 'Deploy backend only from the selected existing vX.Y.Z tag; do not rebuild or publish installers'
        type: boolean
        default: false
      recovery_tag:
        description: 'Publication recovery only: existing vX.Y.Z tag'
        type: string
      source_run_id:
        description: 'Publication recovery only: fully built and signed Release run ID with its required rollout completed'
        type: string
permissions:
  contents: read
concurrency:
  group: share-stream-production-release
  cancel-in-progress: false
jobs:
  platforms:
    if: ${{ !inputs.backend_only && needs.version.outputs.cross_platform == 'true' }}
    needs: version
    uses: ./.github/workflows/native-platforms.yml
  version:
    if: ${{ !inputs.source_run_id }}
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      deploy_backend: ${{ steps.release.outputs.deploy_backend }}
      cross_platform: ${{ steps.release.outputs.cross_platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release mode
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          BACKEND_ONLY: ${{ inputs.backend_only }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: python3 scripts/ci/release_policy.py
      - id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/ci/release_info.py --tag "$RELEASE_TAG"
      - name: Verify published application release before backend-only deployment
        if: inputs.backend_only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/ci/release_policy.py --verify-published "$RELEASE_TAG"
  web:
    name: Test and build backend
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - run: npm ci && npx playwright install --with-deps chromium && npm run verify
        working-directory: web
      - run: bash scripts/ci/build-backend.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend
          path: dist/backend/
          retention-days: 7
          if-no-files-found: error
  native:
    if: ${{ !inputs.backend_only }}
    name: Build, sign and notarize macOS
    needs: version
    runs-on: macos-15
    environment: macos-release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: command -v ninja || brew install ninja
      - run: bash scripts/ci/build-native.sh
      - name: Owner Developer ID signature and Apple notarization
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_CREDENTIALS: ${{ secrets.APPLE_NOTARY_CREDENTIALS }}
        run: bash scripts/ci/sign-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            dist/ShareStream-Setup-macOS.zip
            dist/ShareStream-macOS.zip
            dist/ShareStream-Receiver-macOS.zip
            dist/SHA256SUMS.txt
            dist/NOTARIZATION.json
          if-no-files-found: error
          retention-days: 14
  deploy:
    name: Deploy backend through Coolify
    needs: [version, web, native, platforms]
    if: ${{ always() && !cancelled() && needs.version.result == 'success' && needs.web.result == 'success' && (inputs.backend_only || (needs.native.result == 'success' && ((needs.version.outputs.cross_platform == 'true' && needs.platforms.result == 'success') || (needs.version.outputs.cross_platform == 'false' && needs.platforms.result == 'skipped')))) && (inputs.backend_only || needs.version.outputs.deploy_backend == 'true') }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend
          path: dist/backend
      - env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/ci/deploy-backend.sh
  publish:
    name: Publish signed release
    needs: [version, web, native, platforms, deploy]
    if: ${{ always() && !cancelled() && !inputs.backend_only && needs.version.result == 'success' && needs.web.result == 'success' && needs.native.result == 'success' && ((needs.version.outputs.cross_platform == 'true' && needs.platforms.result == 'success') || (needs.version.outputs.cross_platform == 'false' && needs.platforms.result == 'skipped')) && (needs.deploy.result == 'success' || (needs.version.outputs.deploy_backend == 'false' && needs.deploy.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.version.outputs.cross_platform == 'true'
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          CROSS_PLATFORM: ${{ needs.version.outputs.cross_platform }}
        run: |
          python3 scripts/ci/publish-release.py
  recover-publication:
    name: Recover verified release publication
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release mode
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          BACKEND_ONLY: ${{ inputs.backend_only }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: python3 scripts/ci/release_policy.py
      - id: verify
        name: Validate source run, signatures and deployment gates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.recovery_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: python3 scripts/ci/verify-release-recovery.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: dist
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.verify.outputs.cross_platform == 'true'
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify every asset and finish publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.recovery_tag }}
          CROSS_PLATFORM: ${{ steps.verify.outputs.cross_platform }}
        run: python3 scripts/ci/publish-release.py
